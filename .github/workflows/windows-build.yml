name: windows-build

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

# Token só lê o repositório; nenhum job publica nada além do artefato.
permissions:
  contents: read

jobs:
  # Vulnerabilidades conhecidas (RustSec) e fontes de dependência fora do crates.io.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories sources

  build:
    runs-on: windows-latest
    env:
      # CRT estática: o .exe roda sem o Visual C++ Redistributable instalado.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # 1a rodada com SQLCipher: o lock ganha openssl-src/openssl-sys; depois volta a --locked.
      - name: Compilar exemplo demo com SQLCipher
        run: cargo build --release -p whatsapp-rust --example demo --target x86_64-pc-windows-msvc --no-default-features --features "sqlite-storage-sqlcipher,tokio-transport,tokio-runtime,ureq-client,tokio-native,signal"
      - name: Pacotes novos no Cargo.lock
        shell: bash
        run: git diff --stat Cargo.lock; git diff Cargo.lock | grep -E '^\+(name|version|source)' || true
      - name: SHA-256 do binário
        shell: pwsh
        run: (Get-FileHash target/x86_64-pc-windows-msvc/release/examples/demo.exe -Algorithm SHA256).Hash | Tee-Object target/x86_64-pc-windows-msvc/release/examples/demo.exe.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whatsapp-demo-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/examples/demo.exe
            target/x86_64-pc-windows-msvc/release/examples/demo.exe.sha256
            Cargo.lock
          if-no-files-found: error
